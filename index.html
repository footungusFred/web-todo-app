<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Todo App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f2f5;--card:#fff;--text:#333;--sub:#888;--border:#e0e0e0;--accent:#6c63ff;--done:#aaa}
body.dark{--bg:#1a1a2e;--card:#16213e;--text:#eee;--sub:#aaa;--border:#0f3460;--accent:#6c63ff}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;transition:.3s}
.container{max-width:600px;margin:0 auto;padding:2rem 1rem}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
h1{font-size:2rem;font-weight:800;color:var(--accent)}
.dark-toggle{background:none;border:2px solid var(--accent);color:var(--accent);padding:.4rem .9rem;border-radius:20px;cursor:pointer;font-size:.9rem}
.input-box{display:flex;gap:.5rem;margin-bottom:1.5rem}
.input-box input{flex:1;padding:.9rem 1.2rem;border:2px solid var(--border);border-radius:10px;font-size:1rem;background:var(--card);color:var(--text);outline:none;transition:.3s}
.input-box input:focus{border-color:var(--accent)}
.input-box button{background:var(--accent);color:#fff;border:none;padding:.9rem 1.5rem;border-radius:10px;font-size:1rem;cursor:pointer;transition:.3s}
.input-box button:hover{opacity:.9}
.filters{display:flex;gap:.5rem;margin-bottom:1rem}
.filter-btn{background:none;border:2px solid var(--border);color:var(--sub);padding:.4rem 1rem;border-radius:20px;cursor:pointer;transition:.3s}
.filter-btn.active{border-color:var(--accent);color:var(--accent);font-weight:600}
.todo-list{display:flex;flex-direction:column;gap:.7rem}
.todo-item{background:var(--card);border-radius:12px;padding:1rem 1.2rem;display:flex;align-items:center;gap:1rem;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:.3s;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.todo-item.completed .todo-text{text-decoration:line-through;color:var(--done)}
.check-btn{width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);background:none;cursor:pointer;flex-shrink:0;transition:.3s;display:flex;align-items:center;justify-content:center}
.todo-item.completed .check-btn{background:var(--accent);color:#fff}
.todo-text{flex:1;font-size:1rem}
.del-btn{background:none;border:none;color:#ff6b6b;font-size:1.2rem;cursor:pointer;opacity:0;transition:.3s}
.todo-item:hover .del-btn{opacity:1}
.stats{text-align:center;color:var(--sub);margin-top:1rem;font-size:.9rem}
.empty{text-align:center;padding:3rem;color:var(--sub);font-size:1.1rem}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>✅ Todo App</h1>
    <button class="dark-toggle" onclick="toggleDark()">🌙 Dark</button>
  </header>
  <div class="input-box">
    <input id="taskInput" placeholder="What needs to be done?" onkeydown="if(event.key==='Enter')addTask()"/>
    <button onclick="addTask()">Add</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('active',this)">Active</button>
    <button class="filter-btn" onclick="setFilter('completed',this)">Completed</button>
  </div>
  <div class="todo-list" id="todoList"></div>
  <div class="stats" id="stats"></div>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let filter = 'all';

function save() { localStorage.setItem('tasks', JSON.stringify(tasks)); }

function render() {
  const list = document.getElementById('todoList');
  const filtered = tasks.filter(t => filter === 'all' || (filter === 'active' && !t.done) || (filter === 'completed' && t.done));
  if (!filtered.length) { list.innerHTML = '<div class="empty">🎉 Nothing here!</div>'; }
  else {
    list.innerHTML = filtered.map(t => `
      <div class="todo-item${t.done?' completed':''}">
        <button class="check-btn" onclick="toggle(${t.id})">${t.done?'✓':''}</button>
        <span class="todo-text">${t.text}</span>
        <button class="del-btn" onclick="remove(${t.id})">🗑</button>
      </div>`).join('');
  }
  const rem = tasks.filter(t => !t.done).length;
  document.getElementById('stats').textContent = `${rem} task${rem!==1?'s':''} remaining`;
}

function addTask() {
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if (!text) return;
  tasks.push({ id: Date.now(), text, done: false });
  input.value = '';
  save(); render();
}

function toggle(id) { const t = tasks.find(t=>t.id===id); if(t) t.done=!t.done; save(); render(); }
function remove(id) { tasks = tasks.filter(t=>t.id!==id); save(); render(); }
function setFilter(f, btn) { filter = f; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); }
function toggleDark() { document.body.classList.toggle('dark'); }

render();
</script>
</body>
</html>
